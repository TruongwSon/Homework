<p>group-customer works!</p>

<p style="color: red;">
    {{errMessage}}
</p>

<table border="1" cellspacing="2" cellpadding="5"
       style="width: 500px; border-collapse: collapse; margin-bottom: 25px;">

    <tr>
        <td>Id</td>
        <td>Name</td>
        <td>Email</td>
        <td>Age</td>
        <td>Picture</td>
    </tr>

    <tbody *ngFor="let group of groupCustomers">
        <tr>
            <td colspan="5">
                {{group.CustomerTypeId}} - {{group.CustomerTypeName}}
            </td>
        </tr>
        <tr *ngFor="let cus of group.Customers">
            <td>
                {{cus.Id}}
            </td>

            <td>
                {{cus.Name}}
            </td>

            <td>
                {{cus.Email}}
            </td>
            <td>
                {{cus.Age}}
            </td>
            <td>
                <img 
                    [src]="cus.Image"
                    width="60"
                    height="60"
                    alt="{{cus.Name}}"
                >
            </td>

        </tr>

    </tbody>

</table>
